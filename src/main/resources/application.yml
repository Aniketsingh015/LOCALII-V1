spring:
  application:
    name: localii-backend

  datasource:
    url: jdbc:postgresql://localhost:5440/localii
    username: localii
    password: localii_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'validate' means: don't let Hibernate auto-create tables.
      # Flyway migrations are the single source of truth for schema.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  

server:
  port: 8080

# Custom app properties (read via @Value or a @ConfigurationProperties class later)
localii:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-1234}
    expiration-ms: 86400000
