services:
  postgres:
    image: postgres:16
    container_name: localii-postgres
    environment:
      POSTGRES_DB: localii
      POSTGRES_USER: localii
      POSTGRES_PASSWORD: localii_dev_password
    ports:
      - "5432:5432"
    volumes:
      - localii_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: localii-redis
    ports:
      - "6379:6379"

volumes:
  localii_postgres_data:
